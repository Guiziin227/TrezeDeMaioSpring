<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Item - Museu</title>

    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link th:href="@{/css/header.css}" rel="stylesheet">
    <link th:href="@{/css/cadastroacervo.css}" rel="stylesheet">
    <link th:href="@{/css/footer.css}" rel="stylesheet">
</head>
<body>

<header th:replace="~{fragments :: cabecalho}"></header>

<div class="main-container">

    <div class="cadastro-card card-grande">
        <h1 class="cadastro-titulo">Cadastro de Acervo</h1>

        <form th:action="@{/acervo/create}" th:object="${item}" method="post" enctype="multipart/form-data" class="form-container">
            <input type="hidden" th:field="*{id}" />

            <div class="input-group-custom full-width">
                <label for="tipo">Tipo de Item</label>
                <select id="tipo" th:field="*{tipo}" class="custom-input" onchange="toggleFields()">
                    <option value="">Selecione o tipo de acervo...</option>
                    <option th:each="t : ${tipos}" th:value="${t}" th:text="${t}"></option>
                </select>
                <span th:if="${#fields.hasErrors('tipo')}" th:errors="*{tipo}" class="field-error"></span>
            </div>

            <!-- Seções dinâmicas de subtipos -->
            <div id="sec-livro" class="subtype-section" style="display:none;">
                <h3 class="subtype-titulo">Campos do Livro</h3>
                <div class="form-grid">
                    <div class="input-group-custom">
                        <label for="isbn">ISBN</label>
                        <input id="isbn" type="text" th:field="*{isbn}" class="custom-input" placeholder="ISBN do livro">
                    </div>
                    <div class="input-group-custom">
                        <label for="assuntos">Assuntos</label>
                        <input id="assuntos" type="text" th:field="*{assuntos}" class="custom-input" placeholder="Assuntos (separados por vírgula)">
                    </div>
                </div>
            </div>

            <div id="sec-jornal" class="subtype-section" style="display:none;">
                <h3 class="subtype-titulo">Campos do Jornal</h3>
                <div class="form-grid">
                    <div class="input-group-custom">
                        <label for="secao">Seção</label>
                        <input id="secao" type="text" th:field="*{secao}" class="custom-input" placeholder="Seção do jornal">
                    </div>
                    <div class="input-group-custom">
                        <label for="cidade">Cidade</label>
                        <input id="cidade" type="text" th:field="*{cidade}" class="custom-input" placeholder="Cidade de publicação">
                    </div>
                </div>
            </div>

            <div id="sec-revista" class="subtype-section" style="display:none;">
                <h3 class="subtype-titulo">Campos da Revista</h3>
                <div class="form-grid">
                    <div class="input-group-custom full-width">
                        <label for="issn">ISSN</label>
                        <input id="issn" type="text" th:field="*{issn}" class="custom-input" placeholder="ISSN da revista">
                    </div>
                </div>
            </div>

            <!-- Grade de informações gerais -->
            <div class="form-grid">
                <div class="input-group-custom">
                    <label for="titulo">Título</label>
                    <input id="titulo" type="text" th:field="*{titulo}" class="custom-input" placeholder="Título principal">
                    <span th:if="${#fields.hasErrors('titulo')}" th:errors="*{titulo}" class="field-error"></span>
                </div>

                <div class="input-group-custom">
                    <label for="subtitulo">Subtítulo</label>
                    <input id="subtitulo" type="text" th:field="*{subtitulo}" class="custom-input" placeholder="Subtítulo (opcional)">
                </div>

                <div class="input-group-custom">
                    <label for="autor">Autor</label>
                    <input id="autor" type="text" th:field="*{autor}" class="custom-input" placeholder="Autor do item">
                    <span th:if="${#fields.hasErrors('autor')}" th:errors="*{autor}" class="field-error"></span>
                </div>

                <div class="input-group-custom">
                    <label for="edicao">Edição</label>
                    <input id="edicao" type="text" th:field="*{edicao}" class="custom-input" placeholder="Ex: 1ª Edição">
                </div>

                <div class="input-group-custom">
                    <label for="totalPaginas">Qtd. de Páginas</label>
                    <input id="totalPaginas" type="number" th:field="*{totalPaginas}" class="custom-input" min="0">
                </div>

                <div class="input-group-custom">
                    <label for="dataPublicacao">Data de Publicação</label>
                    <input id="dataPublicacao" type="date" th:field="*{dataPublicacao}" class="custom-input">
                </div>

                <div class="input-group-custom">
                    <label for="idioma">Idioma</label>
                    <input id="idioma" type="text" th:field="*{idioma}" class="custom-input" placeholder="Ex: Português">
                </div>

                <div class="input-group-custom">
                    <label for="quantidade">Qtd. em Estoque</label>
                    <input id="quantidade" type="number" th:field="*{quantidade}" class="custom-input" min="0">
                    <span th:if="${#fields.hasErrors('quantidade')}" th:errors="*{quantidade}" class="field-error"></span>
                </div>

                <div class="input-group-custom">
                    <label for="doador">Doador</label>
                    <input id="doador" type="text" th:field="*{doador}" class="custom-input" placeholder="Nome do doador (opcional)">
                </div>

                <div class="input-group-custom">
                    <label for="editoraId">Editora</label>
                    <div style="display: flex; gap: 8px; align-items: center;">
                        <select id="editoraId" th:field="*{editoraId}" class="custom-input" style="flex: 1;">
                            <option value="">Nenhuma</option>
                            <option th:each="e : ${editoras}" th:value="${e.id}" th:text="${e.nome}"></option>
                        </select>
                        <button type="button" class="btn btn-outline-secondary" onclick="abrirModalEditora()" style="border-radius: 8px; border: 1px solid #ccc; display: flex; align-items: center; justify-content: center; width: 42px; height: 42px; background: white;" title="Adicionar Nova Editora">
                            <i class="bi bi-plus-lg" style="font-size: 20px; color: #4e3629;"></i>
                        </button>
                    </div>
                </div>

                <div class="input-group-custom">
                    <label for="localizacao">Localização física</label>
                    <input id="localizacao" type="text" th:field="*{localizacao}" class="custom-input" placeholder="Corredor A, Prateleira 2">
                </div>

                <div class="input-group-custom">
                    <label for="codigo">Código de Identificação</label>
                    <input id="codigo" type="text" class="custom-input" placeholder="Gerado automaticamente" disabled>
                </div>

                <div class="input-group-custom full-width">
                    <label for="descricao">Descrição</label>
                    <textarea id="descricao" th:field="*{descricao}" class="custom-input" rows="3" placeholder="Descrição resumida..."></textarea>
                </div>

                <div class="input-group-custom full-width">
                    <label for="observacao">Observações</label>
                    <textarea id="observacao" th:field="*{observacao}" class="custom-input" rows="2" placeholder="Observações gerais..."></textarea>
                </div>

                <div class="input-group-custom full-width">
                    <label for="imagem">Capa / Imagem do Item</label>
                    <input id="imagem" type="file" name="imagem" accept="image/*" class="custom-input">
                    <small th:if="*{imagemUrl != null}" style="color: #666; display: block; margin-top: 4px;">
                        Já existe uma imagem cadastrada. Selecione um novo arquivo apenas se desejar alterá-la.
                    </small>
                </div>

                <!-- Checkbox de visibilidade reestruturado e validado para evitar erros de sintaxe -->
                <div class="input-group-custom full-width" style="margin-top: 15px;">
                    <label for="visivel" style="display: flex; align-items: center; gap: 8px; cursor: pointer; font-weight: 500;">
                        <input id="visivel" type="checkbox" th:field="*{ativo}" style="width: 18px; height: 18px; cursor: pointer;" />
                        <span>Disponível / Visível no acervo público</span>
                    </label>
                </div>
            </div> <!-- Fim da div form-grid -->

            <div class="actions" style="margin-top: 20px;">
                <button type="submit" class="btn-salvar">Salvar Acervo</button>
                <a th:href="@{/acervo/gerenciar}" class="link-voltar">Voltar para a lista</a>
            </div>
        </form>

    </div>
</div>

<script>
    function toggleFields() {
        var type = document.getElementById("tipo").value;

        // Esconder todas as seções com animação/display
        document.getElementById("sec-livro").style.display = "none";
        document.getElementById("sec-jornal").style.display = "none";
        document.getElementById("sec-revista").style.display = "none";

        // Desabilitar inputs das seções ocultas
        toggleInputs("sec-livro", true);
        toggleInputs("sec-jornal", true);
        toggleInputs("sec-revista", true);

        if (type === "LIVRO") {
            document.getElementById("sec-livro").style.display = "block";
            toggleInputs("sec-livro", false);
        } else if (type === "JORNAL") {
            document.getElementById("sec-jornal").style.display = "block";
            toggleInputs("sec-jornal", false);
        } else if (type === "REVISTA") {
            document.getElementById("sec-revista").style.display = "block";
            toggleInputs("sec-revista", false);
        }
    }

    function toggleInputs(sectionId, disable) {
        var section = document.getElementById(sectionId);
        var inputs = section.getElementsByTagName("input");
        for (var i = 0; i < inputs.length; i++) {
            inputs[i].disabled = disable;
        }
    }

    // Executar no carregamento
    window.onload = toggleFields;
</script>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        var primeiroErro = document.querySelector(".field-error");
        if (primeiroErro) {
            primeiroErro.scrollIntoView({ behavior: "smooth", block: "center" });
        }
    });
</script>

<!-- Modal para Cadastro Rápido de Editora -->
<div id="modalEditoraRapida" class="custom-modal">
    <div class="modal-overlay" onclick="fecharModalEditora()"></div>
    <div class="modal-card" style="text-align: left; max-width: 450px; max-height: 90vh; overflow-y: auto;">
        <h3 class="modal-title" style="text-align: center; margin-bottom: 20px; font-family: 'Baloo 2', sans-serif; font-weight: 600; color: #352c23;">Adicionar Nova Editora</h3>

        <div style="margin-bottom: 15px;">
            <label for="rapidoNome" style="display: block; margin-bottom: 5px; font-weight: 600; font-size: 0.95rem; color: #352c23;">Nome da Editora *</label>
            <input type="text" id="rapidoNome" class="custom-input" placeholder="Ex: Editora Rocco" required>
        </div>

        <div style="margin-bottom: 15px;">
            <label for="rapidoCnpj" style="display: block; margin-bottom: 5px; font-weight: 600; font-size: 0.95rem; color: #352c23;">CNPJ (opcional)</label>
            <input type="text" id="rapidoCnpj" class="custom-input" placeholder="00.000.000/0000-00">
        </div>

        <!-- Campos opcionais de endereço -->
        <details style="margin-bottom: 20px; cursor: pointer; border: 1px solid rgba(53, 44, 35, 0.15); padding: 12px; border-radius: 12px; background-color: rgba(255,255,255,0.45);">
            <summary style="font-weight: 600; font-size: 0.95rem; color: #352c23; outline: none; margin-bottom: 5px;">
                Adicionar Endereço (Opcional)
            </summary>
            <div style="margin-top: 12px; display: flex; flex-direction: column; gap: 12px;">
                <div>
                    <label for="rapidoCep" style="display: block; margin-bottom: 4px; font-weight: 600; font-size: 0.85rem; color: #4e3c2e;">CEP</label>
                    <input type="text" id="rapidoCep" class="custom-input" style="padding: 10px 14px;" placeholder="00000-000">
                </div>
                <div style="display: flex; gap: 12px;">
                    <div style="flex: 2;">
                        <label for="rapidoLogradouro" style="display: block; margin-bottom: 4px; font-weight: 600; font-size: 0.85rem; color: #4e3c2e;">Logradouro</label>
                        <input type="text" id="rapidoLogradouro" class="custom-input" style="padding: 10px 14px;" placeholder="Rua, Av, etc.">
                    </div>
                    <div style="flex: 1;">
                        <label for="rapidoNumero" style="display: block; margin-bottom: 4px; font-weight: 600; font-size: 0.85rem; color: #4e3c2e;">Número</label>
                        <input type="text" id="rapidoNumero" class="custom-input" style="padding: 10px 14px;" placeholder="123">
                    </div>
                </div>
                <div>
                    <label for="rapidoBairro" style="display: block; margin-bottom: 4px; font-weight: 600; font-size: 0.85rem; color: #4e3c2e;">Bairro</label>
                    <input type="text" id="rapidoBairro" class="custom-input" style="padding: 10px 14px;" placeholder="Bairro">
                </div>
                <div style="display: flex; gap: 12px;">
                    <div style="flex: 1;">
                        <label for="rapidoCidade" style="display: block; margin-bottom: 4px; font-weight: 600; font-size: 0.85rem; color: #4e3c2e;">Cidade</label>
                        <input type="text" id="rapidoCidade" class="custom-input" style="padding: 10px 14px;" placeholder="Cidade">
                    </div>
                    <div style="flex: 1;">
                        <label for="rapidoEstado" style="display: block; margin-bottom: 4px; font-weight: 600; font-size: 0.85rem; color: #4e3c2e;">Estado</label>
                        <input type="text" id="rapidoEstado" class="custom-input" style="padding: 10px 14px;" placeholder="UF">
                    </div>
                </div>
                <div>
                    <label for="rapidoPais" style="display: block; margin-bottom: 4px; font-weight: 600; font-size: 0.85rem; color: #4e3c2e;">País</label>
                    <input type="text" id="rapidoPais" class="custom-input" style="padding: 10px 14px;" placeholder="Brasil" value="Brasil">
                </div>
            </div>
        </details>

        <div class="modal-actions" style="gap: 15px; justify-content: flex-end;">
            <button type="button" class="btn-cancelar" onclick="fecharModalEditora()">Cancelar</button>
            <button type="button" class="btn-confirmar" onclick="salvarEditoraRapida()" style="background-color: #352c23; box-shadow: 0 4px 10px rgba(53, 44, 35, 0.2);">Salvar</button>
        </div>
    </div>
</div>

<script>
    function abrirModalEditora() {
        document.getElementById("modalEditoraRapida").classList.add("active");
        document.getElementById("rapidoNome").value = "";
        document.getElementById("rapidoCnpj").value = "";
        document.getElementById("rapidoCep").value = "";
        document.getElementById("rapidoLogradouro").value = "";
        document.getElementById("rapidoNumero").value = "";
        document.getElementById("rapidoBairro").value = "";
        document.getElementById("rapidoCidade").value = "";
        document.getElementById("rapidoEstado").value = "";
        document.getElementById("rapidoPais").value = "";

        // Se houver um details, garante que ele inicie fechado
        const details = document.querySelector("#modalEditoraRapida details");
        if (details) {
            details.open = false;
        }
    }

    function fecharModalEditora() {
        document.getElementById("modalEditoraRapida").classList.remove("active");
    }

    function salvarEditoraRapida() {
        const nome = document.getElementById("rapidoNome").value;
        const cnpj = document.getElementById("rapidoCnpj").value;
        const cep = document.getElementById("rapidoCep").value;
        const logradouro = document.getElementById("rapidoLogradouro").value;
        const numero = document.getElementById("rapidoNumero").value;
        const bairro = document.getElementById("rapidoBairro").value;
        const cidade = document.getElementById("rapidoCidade").value;
        const estado = document.getElementById("rapidoEstado").value;
        const pais = document.getElementById("rapidoPais").value;

        if (!nome || nome.trim() === "") {
            alert("O nome da editora é obrigatório.");
            return;
        }

        const csrfInput = document.querySelector("input[name='_csrf']");
        const csrfToken = csrfInput ? csrfInput.value : "";

        const params = new URLSearchParams();
        params.append("nome", nome.trim());
        params.append("cnpj", cnpj.trim());
        params.append("cep", cep.trim());
        params.append("logradouro", logradouro.trim());
        params.append("numero", numero.trim());
        params.append("bairro", bairro.trim());
        params.append("cidade", cidade.trim());
        params.append("estado", estado.trim());
        params.append("pais", pais.trim());
        if (csrfToken) {
            params.append("_csrf", csrfToken);
        }

        fetch("/editora/api/rapido", {
            method: "POST",
            headers: {
                "Content-Type": "application/x-www-form-urlencoded",
                "X-CSRF-TOKEN": csrfToken
            },
            body: params.toString()
        })
        .then(response => {
            if (!response.ok) {
                return response.text().then(text => {
                    throw new Error(text || "Erro desconhecido no servidor.");
                });
            }
            return response.json();
        })
        .then(data => {
            const select = document.getElementById("editoraId");
            const opt = document.createElement("option");
            opt.value = data.id;
            opt.text = data.nome;
            select.add(opt);
            select.value = data.id;
            fecharModalEditora();
        })
        .catch(err => {
            alert("Erro ao cadastrar editora: " + err.message);
        });
    }
</script>

<footer th:replace="~{fragments :: rodape}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
