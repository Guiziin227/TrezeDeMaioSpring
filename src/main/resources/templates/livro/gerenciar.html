<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciamento de Acervo - Museu</title>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/header.css}" rel="stylesheet">
    <link th:href="@{/css/listausuario.css}" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>
<body>

<header th:replace="~{fragments :: cabecalho}"></header>

<div class="main-container">
    <div class="cadastro-card card-grande">
        <h1 class="cadastro-titulo">Itens cadastrados no Acervo</h1>

        <div class="actions-top" sec:authorize="hasAnyAuthority('ADMINISTRADOR', 'BIBLIOTECARIO')">
            <a th:href="@{/livro/form}" class="btn-novo">Novo Item de Acervo</a>
        </div>

        <div class="table-responsive">
            <table class="custom-table">
                <thead>
                    <tr>
                        <th>Tipo</th>
                        <th>Título</th>
                        <th>Autor</th>
                        <th>Código</th>
                        <th>Detalhes Específicos</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="item : ${itens}">
                        <td>
                            <!-- Usando o tipo para aplicar uma classe de badge dinâmica (livro, jornal, revista) -->
                            <span class="badge-perfil" th:classappend="${#strings.toLowerCase(item.type)}" th:text="${item.type}">Tipo</span>
                        </td>
                        <td th:text="${item.title}">Título</td>
                        <td th:text="${item.autor}">Autor</td>
                        <td th:text="${item.codigo}">Código</td>
                        <td th:text="${item.infoEspecifica}">Info Especifica</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="actions">
            <a th:href="@{/}" class="link-voltar">Voltar para a página inicial</a>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
