<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Item</title>
    <style>
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: inline-block;
            width: 150px;
            font-weight: bold;
        }
        input, select, textarea {
            width: 300px;
            padding: 5px;
        }
        .subtype-section {
            border: 1px solid #ccc;
            padding: 15px;
            margin: 15px 0;
            background-color: #f9f9f9;
        }
    </style>
</head>
<body>
<h1>Cadastro de Acervo (Livro, Jornal ou Revista)</h1>

<form th:action="@{/livro/create}" th:object="${item}" method="post">
    <!-- Seleção de Tipo -->
    <div class="form-group">
        <label for="type">Tipo de Item</label>
        <select id="type" th:field="*{type}" onchange="toggleFields()" required>
            <option value="">Selecione o tipo</option>
            <option th:each="t : ${tipos}" th:value="${t}" th:text="${t}"></option>
        </select>
    </div>

    <!-- Campos comuns do Item -->
    <div class="form-group">
        <label for="title">Título</label>
        <input id="title" type="text" th:field="*{title}" required placeholder="Título principal">
    </div>

    <div class="form-group">
        <label for="subtitle">Subtítulo</label>
        <input id="subtitle" type="text" th:field="*{subtitle}" placeholder="Subtítulo (opcional)">
    </div>

    <div class="form-group">
        <label for="autor">Autor</label>
        <input id="autor" type="text" th:field="*{autor}" placeholder="Autor do item">
    </div>

    <div class="form-group">
        <label for="edicao">Edição</label>
        <input id="edicao" type="text" th:field="*{edicao}" placeholder="Ex: 1ª Edição">
    </div>

    <div class="form-group">
        <label for="pagesCount">Quantidade de Páginas</label>
        <input id="pagesCount" type="number" th:field="*{pagesCount}" min="0">
    </div>

    <div class="form-group">
        <label for="publicationDate">Data de Publicação</label>
        <input id="publicationDate" type="date" th:field="*{publicationDate}">
    </div>

    <div class="form-group">
        <label for="language">Idioma</label>
        <input id="language" type="text" th:field="*{language}" placeholder="Ex: Português">
    </div>

    <div class="form-group">
        <label for="quantity">Quantidade em Estoque</label>
        <input id="quantity" type="number" th:field="*{quantity}" min="0" required>
    </div>

    <div class="form-group">
        <label for="localization">Localização física</label>
        <input id="localization" type="text" th:field="*{localization}" placeholder="Ex: Corredor A, Prateleira 2">
    </div>

    <div class="form-group">
        <label for="description">Descrição</label>
        <textarea id="description" th:field="*{description}" rows="3" placeholder="Descrição resumida..."></textarea>
    </div>

    <div class="form-group">
        <label for="observation">Observações</label>
        <textarea id="observation" th:field="*{observation}" rows="2" placeholder="Observações gerais..."></textarea>
    </div>

    <!-- Dropdown Doador -->
    <div class="form-group">
        <label for="doadorId">Doador</label>
        <select id="doadorId" th:field="*{doadorId}">
            <option value="">Nenhum</option>
            <option th:each="d : ${doadores}" th:value="${d.id}" th:text="${d.name}"></option>
        </select>
    </div>

    <!-- Dropdown Editora -->
    <div class="form-group">
        <label for="editoraId">Editora</label>
        <select id="editoraId" th:field="*{editoraId}">
            <option value="">Nenhuma</option>
            <option th:each="e : ${editoras}" th:value="${e.id}" th:text="${e.name}"></option>
        </select>
    </div>

    <!-- Campo Código (Gerado automaticamente pelo servidor) -->
    <div class="form-group">
        <label for="codigo">Código de Identificação</label>
        <input id="codigo" type="text" placeholder="Gerado automaticamente" disabled>
    </div>


    <!-- SEÇÃO ESPECÍFICA: LIVRO -->
    <div id="sec-livro" class="subtype-section" style="display:none;">
        <h3>Campos do Livro</h3>
        <div class="form-group">
            <label for="isbn">ISBN</label>
            <input id="isbn" type="text" th:field="*{isbn}" placeholder="ISBN do livro">
        </div>
        <div class="form-group">
            <label for="assuntos">Assuntos</label>
            <input id="assuntos" type="text" th:field="*{assuntos}" placeholder="Assuntos (separados por vírgula)">
        </div>
    </div>

    <!-- SEÇÃO ESPECÍFICA: JORNAL -->
    <div id="sec-jornal" class="subtype-section" style="display:none;">
        <h3>Campos do Jornal</h3>
        <div class="form-group">
            <label for="secao">Seção</label>
            <input id="secao" type="text" th:field="*{secao}" placeholder="Seção do jornal">
        </div>
        <div class="form-group">
            <label for="cidade">Cidade</label>
            <input id="cidade" type="text" th:field="*{cidade}" placeholder="Cidade de publicação">
        </div>
    </div>

    <!-- SEÇÃO ESPECÍFICA: REVISTA -->
    <div id="sec-revista" class="subtype-section" style="display:none;">
        <h3>Campos da Revista</h3>
        <div class="form-group">
            <label for="issn">ISSN</label>
            <input id="issn" type="text" th:field="*{issn}" placeholder="ISSN da revista">
        </div>
    </div>


    <div class="actions" style="margin-top: 20px;">
        <button type="submit">Salvar</button>
        <a th:href="@{/livro}">Ver lista</a>
    </div>
</form>

<script>
    function toggleFields() {
        var type = document.getElementById("type").value;
        
        // Esconder todas as seções
        document.getElementById("sec-livro").style.display = "none";
        document.getElementById("sec-jornal").style.display = "none";
        document.getElementById("sec-revista").style.display = "none";
        
        // Desabilitar inputs das seções ocultas para não enviar dados desnecessários ou dar erro de validação
        toggleInputs("sec-livro", true);
        toggleInputs("sec-jornal", true);
        toggleInputs("sec-revista", true);
        
        if (type === "LIVRO") {
            document.getElementById("sec-livro").style.display = "block";
            toggleInputs("sec-livro", false);
        } else if (type === "JORNAL") {
            document.getElementById("sec-jornal").style.display = "block";
            toggleInputs("sec-jornal", false);
        } else if (type === "REVISTA") {
            document.getElementById("sec-revista").style.display = "block";
            toggleInputs("sec-revista", false);
        }
    }

    function toggleInputs(sectionId, disable) {
        var section = document.getElementById(sectionId);
        var inputs = section.getElementsByTagName("input");
        for (var i = 0; i < inputs.length; i++) {
            inputs[i].disabled = disable;
        }
    }

    // Executar no carregamento
    window.onload = toggleFields;
</script>
</body>
</html>
