<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novo Usuário</title>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/header.css}" rel="stylesheet">
    <link th:href="@{/css/cadastrousuario.css}" rel="stylesheet">
</head>
<body>

<header th:replace="~{fragments :: cabecalho}"></header>

<div class="main-container">

    <div class="cadastro-card">
        <h1 class="cadastro-titulo">Cadastro de Usuário</h1>

        <form th:action="@{/usuario/create}" th:object="${usuario}" method="post" class="form-container">
            <input type="hidden" th:field="*{id}">

            <div class="input-group-custom">
                <label for="name">Nome</label>
                <input id="name" type="text" th:field="*{name}" placeholder="Digite o nome completo" class="custom-input" required>
            </div>

            <div class="input-group-custom">
                <label for="password">Senha</label>
                <input id="password" type="password" th:field="*{password}" placeholder="Digite a senha" class="custom-input" required>
            </div>

            <div class="input-group-custom">
                <label for="type">Tipo de Perfil</label>
                <select id="type" th:field="*{type}" class="custom-input" required>
                    <option value="">Selecione um perfil...</option>
                    <option th:each="tipo : ${T(com.guris.trezemaio.model.enums.TipoUsuario).values()}"
                            th:value="${tipo}"
                            th:text="${tipo}"></option>
                </select>
            </div>

            <div class="actions">
                <button type="submit" class="btn-salvar">Salvar Usuário</button>
                <a th:href="@{/usuario/list}" class="link-voltar">Ver lista de usuários</a>
            </div>
        </form>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
