<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novo Usuário</title>
</head>
<body>
<h1>Cadastro de Usuário</h1>

<form th:action="@{/usuario/create}" th:object="${usuario}" method="post">
    <div>
        <label for="name">Nome</label>
        <input id="name" type="text" th:field="*{name}" placeholder="Digite o nome" required>
    </div>

    <div>
        <label for="password">Senha</label>
        <input id="password" type="password" th:field="*{password}" placeholder="Digite a senha" required>
    </div>

    <div>
        <label for="type">Tipo</label>
        <select id="type" th:field="*{type}" required>
            <option value="">Selecione</option>
            <option th:each="tipo : ${T(com.guris.trezemaio.model.enums.TipoUsuario).values()}"
                    th:value="${tipo}"
                    th:text="${tipo}"></option>
        </select>
    </div>

    <div class="actions">
        <button type="submit">Salvar</button>
        <a th:href="@{/usuario/list}">Ver lista</a>
    </div>
</form>
</body>
</html>
