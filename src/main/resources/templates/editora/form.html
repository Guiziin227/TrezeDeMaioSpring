<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Editora - Museu</title>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link th:href="@{/css/header.css}" rel="stylesheet">
    <link th:href="@{/css/cadastroacervo.css}" rel="stylesheet">
    <link th:href="@{/css/footer.css}" rel="stylesheet">
</head>
<body>

<header th:replace="~{fragments :: cabecalho}"></header>

<div class="main-container">
    <div class="cadastro-card card-grande">
        <h1 class="cadastro-titulo">Cadastro de Editora</h1>

        <form th:action="@{/editora/create}" th:object="${editora}" method="post" class="form-container">
            <input type="hidden" th:field="*{id}" />
            <input type="hidden" th:field="*{address.id}" />

            <h3 class="subtype-titulo">Dados da Editora</h3>
            <div class="form-grid">
                <div class="input-group-custom">
                    <label for="name">Nome da Editora</label>
                    <input id="name" type="text" th:field="*{name}" class="custom-input" placeholder="Ex: Editora Rocco" required>
                    <span th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="field-error"></span>
                </div>

                <div class="input-group-custom">
                    <label for="cnpj">CNPJ</label>
                    <input id="cnpj" type="text" th:field="*{cnpj}" class="custom-input" placeholder="00.000.000/0000-00">
                    <span th:if="${#fields.hasErrors('cnpj')}" th:errors="*{cnpj}" class="field-error"></span>
                </div>
            </div>

            <h3 class="subtype-titulo" style="margin-top: 25px;">Endereço</h3>
            <div class="form-grid">
                <div class="input-group-custom">
                    <label for="cep">CEP</label>
                    <input id="cep" type="text" th:field="*{address.cep}" class="custom-input" placeholder="00000-000">
                </div>

                <div class="input-group-custom">
                    <label for="logradouro">Logradouro / Rua</label>
                    <input id="logradouro" type="text" th:field="*{address.logradouro}" class="custom-input" placeholder="Ex: Av. Paulista">
                </div>

                <div class="input-group-custom">
                    <label for="numero">Número</label>
                    <input id="numero" type="text" th:field="*{address.numero}" class="custom-input" placeholder="Ex: 123">
                </div>

                <div class="input-group-custom">
                    <label for="bairro">Bairro</label>
                    <input id="bairro" type="text" th:field="*{address.bairro}" class="custom-input" placeholder="Ex: Centro">
                </div>

                <div class="input-group-custom">
                    <label for="cidade">Cidade</label>
                    <input id="cidade" type="text" th:field="*{address.cidade}" class="custom-input" placeholder="Ex: São Paulo">
                </div>

                <div class="input-group-custom">
                    <label for="estado">Estado</label>
                    <input id="estado" type="text" th:field="*{address.estado}" class="custom-input" placeholder="Ex: SP">
                </div>

                <div class="input-group-custom">
                    <label for="pais">País</label>
                    <input id="pais" type="text" th:field="*{address.pais}" class="custom-input" placeholder="Ex: Brasil">
                </div>
            </div>

            <div class="actions" style="margin-top: 30px;">
                <button type="submit" class="btn-salvar">Salvar Editora</button>
                <a th:href="@{/editora}" class="link-voltar">Voltar para a lista</a>
            </div>
        </form>
    </div>
</div>

<footer th:replace="~{fragments :: rodape}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
